# Production-shaped stack on one host. From the repo root:
#   cp .env.example .env   # fill in the three secrets and PUBLIC_HOST
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#
# For server-side rendering of the stream (EGRESS_MODE=livekit) also start the egress profile:
#   docker compose -f infra/docker-compose.yml --env-file .env --profile egress up -d
#
# Scale the stateless tiers with: docker compose ... up -d --scale api=3 --scale worker=4

name: streamlabs-studio

x-app-env: &app-env
  NODE_ENV: production
  WEB_ORIGIN: https://${PUBLIC_HOST:?set PUBLIC_HOST}
  PUBLIC_INGEST_URL: wss://${PUBLIC_HOST}/ingest
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
  DATA_DIR: /data
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}

services:
  web:
    build: { context: .., dockerfile: infra/Dockerfile, target: web }
    environment:
      SITE_ADDRESS: ${PUBLIC_HOST}
    ports: ['80:80', '443:443']
    volumes: [caddy:/data]
    depends_on: [api, worker]
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/studio
      # Browsers reach LiveKit directly; give it its own DNS name with TLS (see docs/ARCHITECTURE.md).
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL, e.g. wss://rtc.example.com}
      EGRESS_MODE: ${EGRESS_MODE:-relay}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    volumes: [media:/data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: infra/Dockerfile, target: worker }
    environment:
      <<: *app-env
      API_INTERNAL_URL: http://api:4000
    volumes: [media:/data]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: studio
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio']
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Reachable from LiveKit, which runs on the host network.
    ports: ['127.0.0.1:6379:6379']
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13
    # WebRTC media needs real UDP ports, so LiveKit uses the host network.
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        # Redis lets several LiveKit nodes form one cluster and carries Egress jobs.
        redis:
          address: 127.0.0.1:6379
        room:
          empty_timeout: 600
          max_participants: 30
        # Tells the API when a server-side egress starts, fails or ends.
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://${PUBLIC_HOST}/api/livekit/webhook
    depends_on: [redis]
    restart: unless-stopped

  egress:
    profiles: [egress]
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ${LIVEKIT_URL}
        redis:
          address: redis:6379
        file_outputs:
          local: true
    volumes: [media:/out]
    working_dir: /out
    cap_add: [SYS_ADMIN]
    depends_on: [redis]
    restart: unless-stopped

volumes:
  pg:
  media:
  caddy:
