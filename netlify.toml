# OmniCast Studio web app on Netlify.
#
# Deploys come from GitHub Actions (.github/workflows/ci.yml): production on every push to main
# that passes the checks, a preview for every pull request. Netlify's own Git builds can stay off.
#
# Netlify serves the built web app only. The API and the media worker run as containers on Render
# (render.yaml): they need ffmpeg, long-lived WebSockets, a database and disk.
# scripts/netlify-redirects.mjs points /api and /assets at the API, so the browser still talks to
# one origin; the host's stream goes straight to the worker.

[build]
  base = "."
  # Netlify installs the dependencies itself before this runs.
  command = "npm run build -w @studio/web && node scripts/netlify-redirects.mjs"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # The API on Render (render.yaml). Not a secret. /api and /assets are proxied to it.
  BACKEND_URL = "https://omnicast-api.onrender.com"

# Built files have a content hash in their name and never change.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"
