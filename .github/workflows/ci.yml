# Checks every push and pull request. Render deploys main by itself (render.yaml), so a change
# reaches production only through code that passed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The media worker's tests run real ffmpeg: encoding, relays, a platform that drops.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
