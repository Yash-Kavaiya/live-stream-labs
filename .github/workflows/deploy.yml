# Checks the code, builds the API and media worker images and deploys them to Cloud Run.
# The web app itself is on Netlify (ci.yml); it proxies /api and /assets here.
#
# Started by hand (Actions → Deploy to Cloud Run → Run workflow), so nothing is created or
# billed by an ordinary push. To deploy on every push to main, add `push: { branches: [main] }`
# under `on:`.
#
# Google access uses Workload Identity Federation: the repository is allowed to act as the
# deploy service account, and no key is stored in GitHub.
#
# Repository secrets needed (32+ random characters each):
#   SESSION_SECRET, ENCRYPTION_KEY, INTERNAL_SECRET
# Repository variables:
#   WEB_ORIGIN   the Netlify site's address, e.g. https://omnicast-studio.netlify.app
# Optional, the default LiveKit project (LiveKit Cloud) for accounts without their own:
#   variable LIVEKIT_URL, secrets LIVEKIT_API_KEY and LIVEKIT_API_SECRET. Without them, each
#   account adds its project in the app under Settings.
#
# After the first deploy, set the repository variable BACKEND_URL to the API address this
# workflow prints, so the Netlify deploy (ci.yml) can point /api at it.
name: Deploy backend to Cloud Run

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: gen-ai-guru-gdg-pune
  PROJECT_NUMBER: '443180956629'
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/gen-ai-guru-gdg-pune/streamlabs
  RUNTIME_SA: streamlabs-runtime@gen-ai-guru-gdg-pune.iam.gserviceaccount.com

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/443180956629/locations/global/workloadIdentityPools/github/providers/live-stream-labs
          service_account: streamlabs-deployer@gen-ai-guru-gdg-pune.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # One build stage feeds both images; the cache makes the second quick.
      - name: Build and push images
        run: |
          for target in api worker; do
            name="$target"
            docker buildx build . -f infra/Dockerfile --target "$target" \
              --cache-from "type=gha,scope=studio" --cache-to "type=gha,scope=studio,mode=max" \
              -t "$REGISTRY/$name:$GITHUB_SHA" --push
          done

      # A Cloud Run address is fixed by the service name, project number and region, so each
      # service can be told where the others are before they exist.
      - name: Work out the service addresses
        run: |
          web="${{ vars.WEB_ORIGIN }}"
          if [ -z "$web" ]; then echo "::error::Set the WEB_ORIGIN variable to the Netlify site address"; exit 1; fi
          {
            echo "WEB_ORIGIN=${web%/}"
            echo "API_HOST=studio-api-$PROJECT_NUMBER.$REGION.run.app"
            echo "WORKER_HOST=studio-worker-$PROJECT_NUMBER.$REGION.run.app"
          } >> "$GITHUB_ENV"

      - name: Deploy the API
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # One instance, always on: uploads and recordings live in the container, and without the
        # optional DATABASE_URL secret so does the database, which a restart would wipe.
        run: |
          gcloud run deploy studio-api --project "$PROJECT_ID" --region "$REGION" \
            --image "$REGISTRY/api:$GITHUB_SHA" --service-account "$RUNTIME_SA" \
            --port 4000 --memory 1Gi --cpu 1 --min-instances 1 --max-instances 1 --no-cpu-throttling \
            --allow-unauthenticated --quiet \
            --set-env-vars "^##^NODE_ENV=production##WEB_ORIGIN=$WEB_ORIGIN##PUBLIC_INGEST_URL=wss://$WORKER_HOST/ingest##DATA_DIR=/tmp/data##SESSION_SECRET=$SESSION_SECRET##ENCRYPTION_KEY=$ENCRYPTION_KEY##INTERNAL_SECRET=$INTERNAL_SECRET##LIVEKIT_URL=$LIVEKIT_URL##LIVEKIT_API_KEY=$LIVEKIT_API_KEY##LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET##DATABASE_URL=$DATABASE_URL"

      - name: Deploy the media worker
        env:
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        # 3600 s is the longest request Cloud Run allows: a stream is cut after an hour, and the
        # browser reconnects. The host's browser connects here directly (wss://…/ingest), since
        # Netlify's proxy does not carry WebSockets. Recordings are handed to the API at the end.
        run: |
          gcloud run deploy studio-worker --project "$PROJECT_ID" --region "$REGION" \
            --image "$REGISTRY/worker:$GITHUB_SHA" --service-account "$RUNTIME_SA" \
            --port 4100 --memory 1Gi --cpu 2 --min-instances 0 --max-instances 2 --no-cpu-throttling \
            --timeout 3600 --concurrency 1 --allow-unauthenticated --quiet \
            --set-env-vars "^##^NODE_ENV=production##API_INTERNAL_URL=https://$API_HOST##DATA_DIR=/tmp/data##UPLOAD_RECORDINGS=1##INTERNAL_SECRET=$INTERNAL_SECRET"

      - name: Smoke test
        run: |
          set -e
          # Not /healthz: Cloud Run reserves that path and answers 404 itself.
          curl -fsS "https://$API_HOST/api/health"
          curl -fsS "https://$WORKER_HOST/health"
          echo
          {
            echo "API: https://$API_HOST"
            echo "Worker: https://$WORKER_HOST"
            echo "Set the repository variable BACKEND_URL to https://$API_HOST for the Netlify deploy."
          } | tee -a "$GITHUB_STEP_SUMMARY"
